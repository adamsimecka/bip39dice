<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" fill="none">
  <rect width="320" height="180" fill="#f3ead7"/>
  <!-- notepad -->
  <rect x="16" y="12" width="288" height="156" rx="4" fill="#fffaf0" stroke="#1c1915" stroke-width="2.5"/>

  <!-- header -->
  <text x="28" y="36" font-family="IBM Plex Mono, monospace" font-size="11" font-weight="700" fill="#6b645a">ROLL</text>
  <text x="100" y="36" font-family="IBM Plex Mono, monospace" font-size="11" font-weight="700" fill="#6b645a">EVEN?</text>
  <text x="180" y="36" font-family="IBM Plex Mono, monospace" font-size="11" font-weight="700" fill="#6b645a">WEIGHT</text>
  <text x="250" y="36" font-family="IBM Plex Mono, monospace" font-size="11" font-weight="700" fill="#6b645a">ADD</text>
  <line x1="28" y1="44" x2="292" y2="44" stroke="#1c1915" stroke-width="1.5"/>

  <!-- row: even, add weight -->
  <text x="28" y="68" font-family="Georgia, serif" font-size="16" fill="#1c1915">4</text>
  <text x="100" y="68" font-family="IBM Plex Mono, monospace" font-size="14" font-weight="700" fill="#2f5d4a">yes</text>
  <text x="180" y="68" font-family="IBM Plex Mono, monospace" font-size="15" font-weight="700" fill="#1c1915">1</text>
  <text x="250" y="68" font-family="IBM Plex Mono, monospace" font-size="15" font-weight="700" fill="#c23b22">+1</text>

  <!-- row: odd, skip -->
  <text x="28" y="96" font-family="Georgia, serif" font-size="16" fill="#1c1915">3</text>
  <text x="100" y="96" font-family="IBM Plex Mono, monospace" font-size="14" font-weight="700" fill="#6b645a">no</text>
  <text x="180" y="96" font-family="IBM Plex Mono, monospace" font-size="15" font-weight="700" fill="#1c1915">2</text>
  <text x="250" y="96" font-family="IBM Plex Mono, monospace" font-size="15" font-weight="700" fill="#6b645a">+0</text>

  <!-- row: even -->
  <text x="28" y="124" font-family="Georgia, serif" font-size="16" fill="#1c1915">6</text>
  <text x="100" y="124" font-family="IBM Plex Mono, monospace" font-size="14" font-weight="700" fill="#2f5d4a">yes</text>
  <text x="180" y="124" font-family="IBM Plex Mono, monospace" font-size="15" font-weight="700" fill="#1c1915">4</text>
  <text x="250" y="124" font-family="IBM Plex Mono, monospace" font-size="15" font-weight="700" fill="#c23b22">+4</text>

  <line x1="28" y1="138" x2="292" y2="138" stroke="#1c1915" stroke-width="2"/>
  <text x="28" y="158" font-family="IBM Plex Mono, monospace" font-size="14" font-weight="700" fill="#1c1915">only evens count</text>
  <text x="230" y="158" font-family="IBM Plex Mono, monospace" font-size="16" font-weight="700" fill="#c23b22">= 5</text>
</svg>
