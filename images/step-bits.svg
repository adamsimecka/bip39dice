<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" fill="none">
  <rect width="320" height="180" fill="#f3ead7"/>

  <!-- Card: odd → 0 -->
  <rect x="18" y="22" width="136" height="136" rx="4" fill="#fffaf0" stroke="#1c1915" stroke-width="2.5"/>
  <text x="86" y="48" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="700" fill="#6b645a">ODD</text>
  <!-- die showing 3 (center pip) -->
  <rect x="51" y="58" width="70" height="70" rx="8" fill="#fffaf0" stroke="#1c1915" stroke-width="2.5"/>
  <circle cx="86" cy="93" r="8" fill="#1c1915"/>
  <text x="86" y="150" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#1c1915">3 → bit 0</text>

  <!-- Card: even → 1 -->
  <rect x="166" y="22" width="136" height="136" rx="4" fill="#fffaf0" stroke="#1c1915" stroke-width="2.5"/>
  <text x="234" y="48" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="700" fill="#2f5d4a">EVEN</text>
  <!-- die showing 4 -->
  <rect x="199" y="58" width="70" height="70" rx="8" fill="#fffaf0" stroke="#c23b22" stroke-width="2.5"/>
  <circle cx="218" cy="77" r="5.5" fill="#1c1915"/>
  <circle cx="250" cy="77" r="5.5" fill="#1c1915"/>
  <circle cx="218" cy="109" r="5.5" fill="#1c1915"/>
  <circle cx="250" cy="109" r="5.5" fill="#1c1915"/>
  <text x="234" y="150" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#c23b22">4 → bit 1</text>
</svg>
