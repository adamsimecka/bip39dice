<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" fill="none">
  <rect width="320" height="180" fill="#f3ead7"/>

  <!-- SKIP card -->
  <rect x="18" y="20" width="136" height="140" rx="4" fill="#fffaf0" stroke="#1c1915" stroke-width="2.5"/>
  <text x="86" y="48" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="13" font-weight="700" fill="#6b645a">ODD = SKIP</text>
  <rect x="51" y="60" width="70" height="70" rx="8" fill="#fffaf0" stroke="#1c1915" stroke-width="2.5"/>
  <circle cx="86" cy="95" r="8" fill="#1c1915"/>
  <text x="86" y="150" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#6b645a">add nothing</text>

  <!-- COUNT card -->
  <rect x="166" y="20" width="136" height="140" rx="4" fill="#fffaf0" stroke="#c23b22" stroke-width="2.5"/>
  <text x="234" y="48" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="13" font-weight="700" fill="#c23b22">EVEN = COUNT</text>
  <rect x="199" y="60" width="70" height="70" rx="8" fill="#fffaf0" stroke="#c23b22" stroke-width="2.5"/>
  <circle cx="218" cy="79" r="5.5" fill="#1c1915"/>
  <circle cx="250" cy="79" r="5.5" fill="#1c1915"/>
  <circle cx="218" cy="111" r="5.5" fill="#1c1915"/>
  <circle cx="250" cy="111" r="5.5" fill="#1c1915"/>
  <text x="234" y="150" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#c23b22">add the weight</text>
</svg>
