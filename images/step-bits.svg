<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" fill="none">
  <rect width="320" height="180" fill="#f3ead7"/>
  <!-- left: odd die -->
  <g transform="translate(28 36)">
    <rect width="70" height="70" rx="8" fill="#fffaf0" stroke="#1c1915" stroke-width="2.5"/>
    <circle cx="35" cy="35" r="7" fill="#1c1915"/>
    <text x="35" y="100" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#1c1915">Roll 3</text>
    <text x="35" y="118" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="12" fill="#6b645a">odd</text>
  </g>
  <!-- arrow -->
  <path d="M112 70h36" stroke="#1c1915" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M140 62l10 8-10 8" fill="#1c1915"/>
  <!-- bit 0 -->
  <g transform="translate(160 48)">
    <rect width="48" height="48" rx="6" fill="#fffaf0" stroke="#1c1915" stroke-width="2.5"/>
    <text x="24" y="34" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="28" font-weight="700" fill="#6b645a">0</text>
  </g>

  <!-- right: even die -->
  <g transform="translate(28 118)">
    <!-- reuse y wrong - put second row higher -->
  </g>
  <g transform="translate(28 36)">
    <!-- second pair lower -->
  </g>

  <!-- second example row -->
  <g transform="translate(28 112)">
    <rect width="70" height="50" rx="8" fill="#fffaf0" stroke="#1c1915" stroke-width="2.5"/>
    <circle cx="22" cy="18" r="4.5" fill="#1c1915"/>
    <circle cx="48" cy="18" r="4.5" fill="#1c1915"/>
    <circle cx="22" cy="34" r="4.5" fill="#1c1915"/>
    <circle cx="48" cy="34" r="4.5" fill="#1c1915"/>
    <text x="90" y="22" font-family="Georgia, serif" font-size="14" fill="#1c1915">Roll 4</text>
    <text x="90" y="40" font-family="IBM Plex Mono, monospace" font-size="12" fill="#2f5d4a">even</text>
  </g>
  <path d="M180 136h28" stroke="#1c1915" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M200 128l10 8-10 8" fill="#1c1915"/>
  <g transform="translate(220 112)">
    <rect width="48" height="48" rx="6" fill="#fffaf0" stroke="#c23b22" stroke-width="2.5"/>
    <text x="24" y="34" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="28" font-weight="700" fill="#c23b22">1</text>
  </g>

  <!-- legend box -->
  <rect x="220" y="36" width="84" height="56" rx="4" fill="#fffaf0" stroke="#1c1915" stroke-width="2"/>
  <text x="232" y="58" font-family="IBM Plex Mono, monospace" font-size="11" fill="#1c1915">odd → 0</text>
  <text x="232" y="78" font-family="IBM Plex Mono, monospace" font-size="11" fill="#c23b22">even → 1</text>
</svg>
