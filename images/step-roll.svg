<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" fill="none">
  <rect width="320" height="180" fill="#e8dcc4"/>
  <!-- felt table -->
  <rect x="16" y="24" width="288" height="132" rx="8" fill="#2f5d4a" stroke="#1c1915" stroke-width="3"/>
  <!-- single die (large) -->
  <g transform="translate(118 48)">
    <rect x="0" y="0" width="84" height="84" rx="10" fill="#fffaf0" stroke="#1c1915" stroke-width="3"/>
    <circle cx="28" cy="28" r="6" fill="#1c1915"/>
    <circle cx="56" cy="28" r="6" fill="#1c1915"/>
    <circle cx="42" cy="42" r="6" fill="#c23b22"/>
    <circle cx="28" cy="56" r="6" fill="#1c1915"/>
    <circle cx="56" cy="56" r="6" fill="#1c1915"/>
  </g>
  <!-- motion arcs -->
  <path d="M95 70c-12 8-18 22-14 36" stroke="#fffaf0" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <path d="M225 70c12 8 18 22 14 36" stroke="#fffaf0" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <!-- sequence of small results -->
  <g font-family="IBM Plex Mono, monospace" font-size="12" font-weight="700" fill="#fffaf0">
    <text x="36" y="148">1st</text>
    <text x="78" y="148">2nd</text>
    <text x="122" y="148">…</text>
    <text x="160" y="148">11th</text>
  </g>
  <!-- mini dice trail -->
  <g transform="translate(36 118)">
    <rect width="22" height="22" rx="3" fill="#fffaf0" stroke="#1c1915" stroke-width="1.5"/>
    <circle cx="11" cy="11" r="2.2" fill="#1c1915"/>
  </g>
  <g transform="translate(78 118)">
    <rect width="22" height="22" rx="3" fill="#fffaf0" stroke="#1c1915" stroke-width="1.5"/>
    <circle cx="7" cy="7" r="2" fill="#1c1915"/>
    <circle cx="15" cy="15" r="2" fill="#1c1915"/>
  </g>
  <g transform="translate(160 118)">
    <rect width="22" height="22" rx="3" fill="#fffaf0" stroke="#1c1915" stroke-width="1.5"/>
    <circle cx="7" cy="7" r="2" fill="#1c1915"/>
    <circle cx="15" cy="7" r="2" fill="#1c1915"/>
    <circle cx="7" cy="15" r="2" fill="#1c1915"/>
    <circle cx="15" cy="15" r="2" fill="#1c1915"/>
  </g>
  <text x="210" y="134" font-family="Georgia, serif" font-size="13" fill="#fffaf0">× 11 times</text>
</svg>
